document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<title>Claude Cheat Sheet — Monterro<\u002Ftitle>\n<style>/* Monterro Design System — Colors & Type */\n\n/* Fonts: Brand uses Arial as the official typeface, system-installed everywhere. */\n\n:root {\n  /* === PRIMARY COLORS (priority) === */\n  --monterro-orange: #FC6C54;     /* Primary Orange — accent, highlights, lines */\n  --monterro-yellow: #FFEC9B;     /* Primary Yellow — gradient pair, highlights */\n  --monterro-navy: #010031;       /* Primary Navy — covers, dividers, dark surfaces */\n  --monterro-offwhite: #FAFAF4;   /* Primary Off White — page background */\n\n  /* === SECONDARY COLORS === */\n  --monterro-sand: #FFDFD1;       /* Secondary Sand — warm pale */\n  --monterro-aqua: #6470F6;       /* Secondary Aqua — cool accent (blue-violet) */\n  --monterro-teal: #8FECEB;       /* Secondary Teal — cool accent */\n  --monterro-black: #0C0D0E;      /* Text Off Black */\n\n  /* === ORANGE SCALE (light → dark, doc lists ascending light) === */\n  --orange-100: #fedbd5;\n  --orange-200: #feb7ab;\n  --orange-300: #ff927e;\n  --orange-400: #fe7c62;\n  --orange-500: #ff6c52;\n\n  /* === YELLOW SCALE === */\n  --yellow-100: #fffae5;\n  --yellow-200: #fef6cc;\n  --yellow-300: #fff0b2;\n  --yellow-400: #feeea1;\n  --yellow-500: #ffed98;\n\n  /* === NAVY SCALE === */\n  --navy-100: #ffdfd1;   /* note: doc lists this in navy scale (paired tint) */\n  --navy-200: #c1c0cc;\n  --navy-300: #80819a;\n  --navy-400: #3f3c66;\n  --navy-500: #131144;\n\n  /* === STATUS / TRAFFIC LIGHTS === */\n  --status-green:       #64ce91;\n  --status-light-green: #bce191;\n  --status-yellow:      #fdfd61;\n  --status-orange:      #fdd761;\n  --status-red:         #fd6461;\n\n  /* === SEMANTIC FOREGROUND / BACKGROUND === */\n  --bg:           var(--monterro-offwhite);\n  --bg-dark:      var(--monterro-navy);\n  --bg-warm:      var(--monterro-sand);\n  --surface:      #ffffff;\n  --surface-dark: #0a0945;\n\n  --fg1:          var(--monterro-black);  /* primary text on light */\n  --fg2:          #4a4b5c;                 /* secondary text on light */\n  --fg3:          #80819a;                 /* tertiary / meta */\n  --fg-on-dark-1: var(--monterro-offwhite);\n  --fg-on-dark-2: #c1c0cc;\n\n  --accent:       var(--monterro-orange);\n  --accent-soft:  var(--monterro-sand);\n  --link:         var(--monterro-aqua);\n\n  --border:       #e6e3da;\n  --border-dark:  #2a2856;\n  --divider:      var(--monterro-orange); /* horizontal accent line under titles */\n\n  /* === RADII === */\n  --radius-xs: 4px;\n  --radius-sm: 8px;\n  --radius-md: 14px;\n  --radius-lg: 24px;\n  --radius-xl: 40px;\n  --radius-pill: 999px;\n\n  /* === SHADOWS — soft, sparse, brand stays clean === */\n  --shadow-sm: 0 1px 2px rgba(1, 0, 49, 0.06);\n  --shadow-md: 0 6px 18px rgba(1, 0, 49, 0.08);\n  --shadow-lg: 0 24px 60px -12px rgba(1, 0, 49, 0.18);\n\n  /* === SPACING (4-pt grid) === */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 96px;\n\n  /* === TYPOGRAPHY === */\n  --font-display: Arial, 'Helvetica Neue', Helvetica, sans-serif;\n  --font-body:    Arial, 'Helvetica Neue', Helvetica, sans-serif;\n  --font-mono:    'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;\n\n  /* === MOTION ===\n     Monterro motion is calm: slow fades, gentle slides, no bounce.\n     Use --ease-out-quart by default; --ease-in-out-quart for two-way transitions. */\n  --dur-fast:   180ms;\n  --dur-base:   320ms;\n  --dur-slow:   540ms;\n  --dur-xslow:  900ms;\n  --ease-out-quart:    cubic-bezier(0.22, 1, 0.36, 1);\n  --ease-in-out-quart: cubic-bezier(0.76, 0, 0.24, 1);\n  --ease-standard:     cubic-bezier(0.4, 0, 0.2, 1);\n\n  /* Type scale */\n  --display-1: 96px;\n  --display-2: 72px;\n  --h1: 56px;\n  --h2: 44px;\n  --h3: 32px;\n  --h4: 24px;\n  --h5: 20px;\n  --body-lg: 18px;\n  --body:    16px;\n  --body-sm: 14px;\n  --caption: 12px;\n\n  --gradient-warm: linear-gradient(135deg, #ff6c52 0%, #ffb893 35%, #ffec9b 70%, #fffae5 100%);\n  --gradient-blob: radial-gradient(60% 80% at 80% 20%, #ff927e 0%, #feb7ab 30%, #ffec9b 60%, transparent 80%),\n                   radial-gradient(50% 70% at 20% 90%, #ffec9b 0%, #fff0b2 40%, transparent 70%);\n  --gradient-cover: linear-gradient(120deg, #010031 0%, #131144 35%, #3f3c66 55%, #ff927e 80%, #ffec9b 100%);\n}\n\n/* === KEYFRAMES === */\n@keyframes m-fade-in       { from { opacity: 0 } to { opacity: 1 } }\n@keyframes m-rise          { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: none } }\n@keyframes m-rise-lg       { from { opacity: 0; transform: translateY(28px) } to { opacity: 1; transform: none } }\n@keyframes m-slide-in-left { from { opacity: 0; transform: translateX(-24px) } to { opacity: 1; transform: none } }\n@keyframes m-blob-drift    { 0%, 100% { transform: translate(0, 0) scale(1) } 50% { transform: translate(20px, -16px) scale(1.04) } }\n@keyframes m-rule-grow     { from { transform: scaleX(0); transform-origin: left } to { transform: scaleX(1); transform-origin: left } }\n@keyframes m-pulse-soft    { 0%, 100% { opacity: .85 } 50% { opacity: 1 } }\n\n/* === ANIMATION UTILITIES === */\n.m-anim-fade   { animation: m-fade-in var(--dur-base) var(--ease-out-quart) both; }\n.m-anim-rise   { animation: m-rise var(--dur-slow) var(--ease-out-quart) both; }\n.m-anim-rise-lg{ animation: m-rise-lg var(--dur-slow) var(--ease-out-quart) both; }\n.m-anim-slide  { animation: m-slide-in-left var(--dur-slow) var(--ease-out-quart) both; }\n.m-anim-rule   { animation: m-rule-grow var(--dur-xslow) var(--ease-out-quart) both; }\n.m-anim-drift  { animation: m-blob-drift 14s ease-in-out infinite; }\n.m-anim-pulse  { animation: m-pulse-soft 4s ease-in-out infinite; }\n\n/* Stagger helpers — apply with .m-anim-rise.m-d1 etc. */\n.m-d1 { animation-delay:  80ms; } .m-d2 { animation-delay: 180ms; }\n.m-d3 { animation-delay: 280ms; } .m-d4 { animation-delay: 380ms; }\n.m-d5 { animation-delay: 480ms; } .m-d6 { animation-delay: 600ms; }\n\n/* Hover/press transitions baseline */\n.m-trans      { transition: all var(--dur-fast) var(--ease-out-quart); }\n.m-trans-bg   { transition: background var(--dur-fast) var(--ease-out-quart); }\n.m-trans-color{ transition: color var(--dur-fast) var(--ease-out-quart); }\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }\n}\n\n/* === BASE / SEMANTIC ELEMENT STYLES === */\nhtml, body {\n  margin: 0;\n  background: var(--bg);\n  color: var(--fg1);\n  font-family: var(--font-body);\n  font-size: var(--body);\n  line-height: 1.5;\n  -webkit-font-smoothing: antialiased;\n}\n\nh1, h2, h3, h4, h5 {\n  font-family: var(--font-display);\n  color: var(--monterro-navy);\n  margin: 0 0 var(--space-4);\n  letter-spacing: -0.02em;\n  line-height: 1.1;\n}\nh1 { font-size: var(--h1); font-weight: 400; }\nh2 { font-size: var(--h2); font-weight: 500; }\nh3 { font-size: var(--h3); font-weight: 600; }\nh4 { font-size: var(--h4); font-weight: 600; }\nh5 { font-size: var(--h5); font-weight: 600; text-transform: none; }\n\np { margin: 0 0 var(--space-4); text-wrap: pretty; }\na { color: var(--link); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color .15s; }\na:hover { border-bottom-color: currentColor; }\n\nsmall, .caption { font-size: var(--caption); color: var(--fg3); }\ncode, pre { font-family: var(--font-mono); font-size: 0.9em; }\n\n/* Signature accent line under section titles */\n.accent-line {\n  border: 0;\n  border-top: 2px solid var(--monterro-orange);\n  margin: var(--space-3) 0 var(--space-5);\n  width: 100%;\n}\n\n/* Buttons */\n.btn {\n  display: inline-flex; align-items: center; gap: 8px;\n  font-family: var(--font-body);\n  font-weight: 600;\n  font-size: var(--body);\n  padding: 12px 22px;\n  border-radius: var(--radius-pill);\n  border: 1.5px solid transparent;\n  cursor: pointer;\n  transition: transform .12s ease, background .15s, color .15s, border-color .15s;\n}\n.btn:active { transform: translateY(1px); }\n.btn-primary { background: var(--monterro-navy); color: var(--monterro-offwhite); }\n.btn-primary:hover { background: #0a0945; }\n.btn-accent  { background: var(--monterro-orange); color: var(--monterro-offwhite); }\n.btn-accent:hover  { background: #fe5a3e; }\n.btn-ghost   { background: transparent; color: var(--monterro-navy); border-color: var(--monterro-navy); }\n.btn-ghost:hover { background: var(--monterro-navy); color: var(--monterro-offwhite); }\n\n/* Cards — minimal: thin border, generous padding, subtle shadow */\n.card {\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--radius-md);\n  padding: var(--space-6);\n  box-shadow: var(--shadow-sm);\n}\n\n/* Dark surface helper */\n.surface-dark {\n  background: var(--monterro-navy);\n  color: var(--monterro-offwhite);\n}\n.surface-dark h1, .surface-dark h2, .surface-dark h3, .surface-dark h4 { color: var(--monterro-offwhite); }\n<\u002Fstyle>\n<style>\n  /* ---------- Page setup ---------- */\n  @page {\n    size: A4 portrait;\n    margin: 0;\n  }\n  html, body {\n    background: #0a0a18;\n  }\n  body {\n    margin: 0;\n    display: flex;\n    justify-content: center;\n    padding: 24px 0;\n    font-family: var(--font-body);\n    color: var(--monterro-offwhite);\n  }\n\n  /* ---------- The page ---------- */\n  .page {\n    width: 210mm;\n    height: 297mm;\n    position: relative;\n    overflow: hidden;\n    background:\n      radial-gradient(120% 70% at 110% -10%, rgba(255, 160, 110, 0.30) 0%, rgba(255, 108, 84, 0.18) 22%, rgba(100, 112, 246, 0.07) 45%, transparent 65%),\n      radial-gradient(80% 60% at -10% 100%, rgba(255, 108, 84, 0.14) 0%, rgba(255, 236, 155, 0.05) 30%, transparent 55%),\n      linear-gradient(180deg, #02022a 0%, #050518 55%, #010014 100%);\n    color: var(--monterro-offwhite);\n    box-shadow: 0 30px 80px rgba(0,0,0,0.5);\n  }\n\n  /* Vertical accent rule running edge — golden ratio spine */\n  .page::after {\n    content: \"\";\n    position: absolute;\n    left: 0; top: 0; bottom: 0;\n    width: 6px;\n    background: linear-gradient(180deg, transparent 0%, rgba(255,108,84,0.0) 8%, var(--monterro-orange) 38%, var(--monterro-orange) 62%, rgba(255,108,84,0.0) 92%, transparent 100%);\n    opacity: 0.85;\n    pointer-events: none;\n  }\n\n  /* AI-infused subtle grid */\n  .page::before {\n    content: \"\";\n    position: absolute; inset: 0;\n    background-image:\n      linear-gradient(to right, rgba(255,255,255,0.030) 1px, transparent 1px),\n      linear-gradient(to bottom, rgba(255,255,255,0.030) 1px, transparent 1px);\n    background-size: 36px 36px;\n    mask-image: radial-gradient(ellipse 90% 80% at 50% 45%, black 30%, transparent 85%);\n    -webkit-mask-image: radial-gradient(ellipse 90% 80% at 50% 45%, black 30%, transparent 85%);\n    pointer-events: none;\n  }\n\n  /* Big warm gradient blob bleeding from top-right (offset to golden-ratio focal point ~38% from right edge) */\n  .blob {\n    position: absolute;\n    top: -220px; right: -200px;\n    width: 680px; height: 680px;\n    background: radial-gradient(closest-side, #ffd9a8 0%, #ffa885 28%, #d65a44 52%, rgba(120,40,30,0.0) 75%);\n    filter: blur(12px);\n    opacity: 0.50;\n    pointer-events: none;\n  }\n  .blob-2 {\n    position: absolute;\n    bottom: -260px; left: -200px;\n    width: 540px; height: 540px;\n    background: radial-gradient(closest-side, #ff927e 0%, #ff6c52 35%, rgba(100,112,246,0.22) 65%, transparent 80%);\n    filter: blur(22px);\n    opacity: 0.50;\n    pointer-events: none;\n  }\n\n  /* Subtle scan line / horizon — placed at golden ratio (61.8%) */\n  .horizon {\n    position: absolute; left: 0; right: 0; top: 61.8%;\n    height: 1px;\n    background: linear-gradient(90deg, transparent, rgba(255,108,84,0.40) 30%, rgba(255,236,155,0.50) 50%, rgba(255,108,84,0.40) 70%, transparent);\n    opacity: 0.4;\n    pointer-events: none;\n  }\n\n  /* ---------- Header ---------- */\n  .frame {\n    position: relative;\n    z-index: 2;\n    padding: 12mm 16mm 7mm;\n    height: 100%;\n    box-sizing: border-box;\n    display: flex;\n    flex-direction: column;\n  }\n\n  .top-row {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    margin-bottom: 7mm;\n  }\n  .eyebrow {\n    display: inline-flex;\n    align-items: center;\n    gap: 12px;\n    font-family: var(--font-mono);\n    font-size: 9.5px;\n    letter-spacing: 0.28em;\n    text-transform: uppercase;\n    color: rgba(250,250,244,0.72);\n  }\n  .eyebrow::before {\n    content: \"\";\n    width: 7px; height: 7px;\n    border-radius: 999px;\n    background: var(--monterro-orange);\n    box-shadow: 0 0 14px var(--monterro-orange);\n    animation: m-pulse-soft 3s ease-in-out infinite;\n  }\n  .eyebrow::after {\n    content: \"\";\n    display: inline-block;\n    width: 32px;\n    height: 1px;\n    background: rgba(250,250,244,0.25);\n    margin-left: 4px;\n  }\n  .badge {\n    font-family: var(--font-mono);\n    font-size: 9.5px;\n    letter-spacing: 0.22em;\n    text-transform: uppercase;\n    color: rgba(250,250,244,0.55);\n    border: 1px solid rgba(250,250,244,0.18);\n    border-radius: 999px;\n    padding: 5px 12px;\n    backdrop-filter: blur(4px);\n  }\n  .logo-mark {\n    width: 38px; height: 38px;\n    border-radius: 999px;\n    border: 1.4px solid rgba(250,250,244,0.85);\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    font-family: var(--font-display);\n    font-size: 17px;\n    color: var(--monterro-offwhite);\n    letter-spacing: 0;\n    line-height: 1;\n  }\n  .logo-mark span { transform: translate(0, 0); }\n  .logo-mark::after { content: \".\"; margin-left: 1px; color: var(--monterro-orange); }\n\n  /* Title block — golden ratio: title 1.618:1 against lede width */\n  .title-block { max-width: 165mm; }\n  .title-block .kicker {\n    font-family: var(--font-mono);\n    font-size: 9px;\n    letter-spacing: 0.30em;\n    text-transform: uppercase;\n    color: var(--monterro-orange);\n    margin: 0 0 12px;\n    display: inline-block;\n  }\n  .title-block h1 {\n    font-family: var(--font-display);\n    font-weight: 300;\n    font-size: 48px;\n    line-height: 1.0;\n    letter-spacing: -0.028em;\n    color: var(--monterro-offwhite);\n    margin: 0;\n  }\n  .title-block h1 b {\n    font-weight: 600;\n    background: linear-gradient(100deg, #ffec9b 0%, #ffb893 35%, #ff6c52 75%);\n    -webkit-background-clip: text;\n    background-clip: text;\n    color: transparent;\n  }\n  .title-block .lede {\n    margin-top: 12px;\n    color: rgba(250,250,244,0.78);\n    font-size: 11.5px;\n    line-height: 1.55;\n    max-width: 102mm;\n    text-wrap: pretty;\n  }\n  .accent-rule {\n    width: 56px;\n    height: 2px;\n    background: var(--monterro-orange);\n    margin: 14px 0 0;\n    box-shadow: 0 0 12px rgba(255,108,84,0.55);\n  }\n\n  /* ---------- Stat strip ---------- */\n  .stats {\n    display: grid;\n    grid-template-columns: repeat(4, 1fr);\n    gap: 0;\n    margin: 5mm 0 4mm;\n    border-top: 1px solid rgba(250,250,244,0.14);\n    border-bottom: 1px solid rgba(250,250,244,0.14);\n  }\n  .stat {\n    padding: 7px 14px;\n    border-right: 1px solid rgba(250,250,244,0.08);\n    position: relative;\n  }\n  .stat:last-child { border-right: 0; }\n  .stat::before {\n    content: \"\";\n    position: absolute;\n    top: -1px; left: 0;\n    width: 28px; height: 1px;\n    background: var(--monterro-orange);\n  }\n  .stat .num {\n    font-family: var(--font-display);\n    font-weight: 300;\n    font-size: 24px;\n    letter-spacing: -0.025em;\n    color: var(--monterro-offwhite);\n    line-height: 1;\n  }\n  .stat .num em {\n    font-style: normal;\n    color: var(--monterro-orange);\n  }\n  .stat .lbl {\n    margin-top: 5px;\n    font-family: var(--font-mono);\n    font-size: 8px;\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    color: rgba(250,250,244,0.55);\n  }\n\n  /* ---------- Columns ---------- */\n  .cols {\n    display: grid;\n    grid-template-columns: 1fr 1fr 1fr;\n    gap: 5mm;\n    flex: 0 1 auto;\n    min-height: 0;\n  }\n  .col {\n    background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.012) 100%);\n    border: 1px solid rgba(250,250,244,0.10);\n    border-radius: 12px;\n    padding: 9px 12px 10px;\n    display: flex;\n    flex-direction: column;\n    backdrop-filter: blur(6px);\n    position: relative;\n    overflow: visible;\n    min-height: 0;\n  }\n  /* Soft inner highlight — gives cards depth */\n  .col::before {\n    content: \"\";\n    position: absolute;\n    inset: 0;\n    border-radius: 12px;\n    background: radial-gradient(60% 30% at 50% 0%, rgba(255,255,255,0.06) 0%, transparent 70%);\n    pointer-events: none;\n  }\n  .col-head {\n    display: flex;\n    align-items: baseline;\n    justify-content: space-between;\n    padding: 2px 2px 7px;\n    border-bottom: 1px solid rgba(250,250,244,0.12);\n    margin-bottom: 6px;\n    position: relative;\n  }\n  .col-head::after {\n    content: \"\";\n    position: absolute;\n    left: 0; bottom: -1px;\n    width: 22px; height: 1px;\n    background: var(--monterro-orange);\n  }\n  .col-head .label {\n    font-family: var(--font-display);\n    font-weight: 700;\n    font-size: 11.5px;\n    letter-spacing: 0.06em;\n    color: var(--monterro-offwhite);\n    text-transform: uppercase;\n  }\n  .col-head .range {\n    font-family: var(--font-mono);\n    font-size: 8.5px;\n    color: rgba(250,250,244,0.5);\n    letter-spacing: 0.14em;\n    text-transform: uppercase;\n  }\n  .col[data-tier=\"beginner\"] .col-head .label { color: #ffec9b; }\n  .col[data-tier=\"intermediate\"] .col-head .label { color: #ffb893; }\n  .col[data-tier=\"pro\"] .col-head .label { color: #ff6c52; }\n\n  /* tip rows */\n  ol.tips {\n    list-style: none;\n    margin: 0; padding: 0;\n    display: flex;\n    flex-direction: column;\n    gap: 1px;\n    counter-reset: tip;\n    position: relative;\n    z-index: 1;\n  }\n  ol.tips li {\n    display: grid;\n    grid-template-columns: 18px 1fr;\n    gap: 7px;\n    padding: 2px 2px 2px;\n    border-bottom: 1px dashed rgba(250,250,244,0.08);\n  }\n  ol.tips li:last-child { border-bottom: 0; }\n  ol.tips li .n {\n    font-family: var(--font-mono);\n    font-size: 8px;\n    color: var(--monterro-orange);\n    padding-top: 2px;\n    letter-spacing: 0.05em;\n    font-weight: 700;\n  }\n  ol.tips li h4 {\n    margin: 0;\n    font-family: var(--font-display);\n    font-size: 9.2px;\n    font-weight: 700;\n    color: var(--monterro-offwhite);\n    line-height: 1.2;\n    letter-spacing: 0.005em;\n  }\n  ol.tips li p {\n    margin: 1.5px 0 0;\n    font-size: 7.8px;\n    line-height: 1.38;\n    color: rgba(250,250,244,0.74);\n    text-wrap: pretty;\n  }\n  ol.tips li code {\n    font-family: var(--font-mono);\n    font-size: 7.4px;\n    color: #ffec9b;\n    background: rgba(255,236,155,0.08);\n    padding: 0 4px;\n    border-radius: 3px;\n    white-space: nowrap;\n  }\n\n  /* ---------- Hero footer: The real unlock ---------- */\n  .hero {\n    margin-top: 4mm;\n    position: relative;\n    border-radius: 14px;\n    padding: 12px 24px;\n    overflow: hidden;\n    flex: 0 0 auto;\n    background:\n      radial-gradient(120% 200% at 100% 50%, rgba(255,236,155,0.28) 0%, rgba(255,108,84,0.18) 30%, transparent 60%),\n      linear-gradient(90deg, rgba(255,108,84,0.10) 0%, rgba(255,108,84,0.03) 100%);\n    border: 1px solid rgba(255,108,84,0.45);\n    display: grid;\n    grid-template-columns: auto 1fr;\n    gap: 24px;\n    align-items: center;\n    box-shadow: 0 0 40px rgba(255,108,84,0.08), inset 0 1px 0 rgba(255,255,255,0.06);\n  }\n  .hero .key {\n    font-family: var(--font-mono);\n    font-size: 10px;\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    color: var(--monterro-orange);\n    border: 1px solid rgba(255,108,84,0.6);\n    padding: 6px 10px;\n    border-radius: 6px;\n    background: rgba(255,108,84,0.06);\n    align-self: center;\n    white-space: nowrap;\n  }\n  .hero h3 {\n    margin: 0 0 2px;\n    font-family: var(--font-display);\n    font-weight: 600;\n    font-size: 16px;\n    color: var(--monterro-offwhite);\n    letter-spacing: -0.018em;\n    line-height: 1.15;\n  }\n  .hero h3 em {\n    font-style: normal;\n    background: linear-gradient(100deg, #ffec9b 0%, #ffb893 50%, #ff6c52 100%);\n    -webkit-background-clip: text;\n    background-clip: text;\n    color: transparent;\n  }\n  .hero p {\n    margin: 0;\n    font-size: 10px;\n    line-height: 1.48;\n    color: rgba(250,250,244,0.82);\n    max-width: 145mm;\n    text-wrap: pretty;\n  }\n  .hero .budget {\n    text-align: right;\n  }\n  .hero .budget .num {\n    font-family: var(--font-display);\n    font-weight: 300;\n    font-size: 24px;\n    line-height: 1;\n    color: #ffec9b;\n    letter-spacing: -0.02em;\n  }\n  .hero .budget .lbl {\n    font-size: 8px;\n    letter-spacing: 0.16em;\n    text-transform: uppercase;\n    color: rgba(250,250,244,0.55);\n    margin-top: 3px;\n  }\n\n  /* ---------- Footer ---------- */\n  .foot {\n    margin-top: 3mm;\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    color: rgba(250,250,244,0.5);\n    font-size: 8.5px;\n    letter-spacing: 0.04em;\n  }\n  .foot .left {\n    display: flex; align-items: center; gap: 14px;\n  }\n  .foot .quote {\n    font-style: italic;\n    color: rgba(250,250,244,0.55);\n    max-width: 110mm;\n  }\n  .foot .mono {\n    font-family: var(--font-mono);\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    color: rgba(250,250,244,0.65);\n  }\n  .foot .sep {\n    width: 1px; height: 14px;\n    background: rgba(250,250,244,0.18);\n  }\n\n  /* monogram bottom-right */\n  .monogram {\n    display: inline-flex;\n    align-items: center;\n    gap: 8px;\n    color: rgba(250,250,244,0.85);\n  }\n  .monogram .circle {\n    width: 22px; height: 22px;\n    border-radius: 999px;\n    border: 1.2px solid currentColor;\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    font-family: var(--font-display);\n    font-size: 11px;\n    letter-spacing: 0;\n    line-height: 1;\n    padding-left: 1px;\n  }\n  .monogram .circle::after { content: \".\"; color: var(--monterro-orange); margin-left: 0; line-height: 1; }\n  .monogram .word {\n    font-family: var(--font-display);\n    font-size: 11px;\n    letter-spacing: 0.18em;\n  }\n\n  /* Print */\n  @media print {\n    body { padding: 0; background: white; }\n    .page { box-shadow: none; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"page\" data-screen-label=\"01 Cheat sheet\">\n  <div class=\"blob\"><\u002Fdiv>\n  <div class=\"blob-2\"><\u002Fdiv>\n  <div class=\"horizon\"><\u002Fdiv>\n\n  <div class=\"frame\">\n    <!-- Top row -->\n    <div class=\"top-row\">\n      <div class=\"eyebrow\">A field guide · Claude Code<\u002Fdiv>\n      <div class=\"badge\">v1 · 2026<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Title -->\n    <div class=\"title-block\">\n      <div class=\"kicker\">The cheat sheet<\u002Fdiv>\n      <h1>32 ways to get<br>more out of <b>Claude.<\u002Fb><\u002Fh1>\n      <div class=\"accent-rule\"><\u002Fdiv>\n      <p class=\"lede\">A single page of moves that change how Claude performs — from first-session hygiene to multi-agent orchestration.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- Stats -->\n    <div class=\"stats\">\n      <div class=\"stat\"><div class=\"num\">32<\u002Fdiv><div class=\"lbl\">tactics<\u002Fdiv><\u002Fdiv>\n      <div class=\"stat\"><div class=\"num\"><em>4×<\u002Fem><\u002Fdiv><div class=\"lbl\">faster, intermediate set<\u002Fdiv><\u002Fdiv>\n      <div class=\"stat\"><div class=\"num\">90<span style=\"color:var(--monterro-orange)\">%<\u002Fspan><\u002Fdiv><div class=\"lbl\">bad outputs prevented<\u002Fdiv><\u002Fdiv>\n      <div class=\"stat\"><div class=\"num\">~32<em>K<\u002Fem><\u002Fdiv><div class=\"lbl\">ultrathink budget<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Columns -->\n    <div class=\"cols\">\n\n      <!-- BEGINNER -->\n      <section class=\"col\" data-tier=\"beginner\">\n        <header class=\"col-head\">\n          <span class=\"label\">Beginner<\u002Fspan>\n          <span class=\"range\">01 — 10<\u002Fspan>\n        <\u002Fheader>\n        <ol class=\"tips\">\n          <li><span class=\"n\">01<\u002Fspan><div>\n            <h4>AGENTS.md, every project<\u002Fh4>\n            <p>Skip <code>/init<\u002Fcode>. Generate a focused ≤150-line file scoped to your codebase, then <code>ln -s AGENTS.md CLAUDE.md<\u002Fcode>.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n          <li><span class=\"n\">02<\u002Fspan><div>\n            <h4>Set up a status line<\u002Fh4>\n            <p><code>/statusline<\u002Fcode> shows model, context %, and cost — a mini dashboard at the bottom of your terminal.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n          <li><span class=\"n\">03<\u002Fspan><div>\n            <h4>Use voice input<\u002Fh4>\n            <p><code>/voice<\u002Fcode> is rolling out. Until then, any dictation app works anywhere.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n          <li><span class=\"n\">04<\u002Fspan><div>\n            <h4>Keep context small<\u002Fh4>\n            <p>Don't dump the whole codebase. Break big problems into focused steps the model can hold in its head.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n          <li><span class=\"n\">05<\u002Fspan><div>\n            <h4><code>/context<\u002Fcode> finds bloat<\u002Fh4>\n            <p>Shows exactly what's eating tokens. Diagnose, then restructure the session.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n          <li><span class=\"n\">06<\u002Fspan><div>\n            <h4><code>/compact<\u002Fcode> at 60%<\u002Fh4>\n            <p>Tell it what to keep. Use <code>/clear<\u002Fcode> when you switch tasks entirely — fresh slate beats stale memory.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n          <li><span class=\"n\">07<\u002Fspan><div>\n            <h4>Always start in plan mode<\u002Fh4>\n            <p>Shift+Tab cycles modes. Claude maps the approach before writing a single line of code.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n          <li><span class=\"n\">08<\u002Fspan><div>\n            <h4>Treat Claude like a human dev<\u002Fh4>\n            <p>Hand it problems, not commands. Better reasoning in, better outputs out.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n          <li><span class=\"n\">09<\u002Fspan><div>\n            <h4>Make it ask questions<\u002Fh4>\n            <p>\"Keep asking until you're 95% confident.\" Cuts revision rounds in half. See the <code>/grill-me<\u002Fcode> skill.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n          <li><span class=\"n\">10<\u002Fspan><div>\n            <h4>Self-checking to-dos<\u002Fh4>\n            <p>Bake screenshot + verify steps into the to-do list. Quality is a habit, not a final pass.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n        <\u002Fol>\n      <\u002Fsection>\n\n      <!-- INTERMEDIATE -->\n      <section class=\"col\" data-tier=\"intermediate\">\n        <header class=\"col-head\">\n          <span class=\"label\">Intermediate<\u002Fspan>\n          <span class=\"range\">11 — 22<\u002Fspan>\n        <\u002Fheader>\n        <ol class=\"tips\">\n          <li><span class=\"n\">11<\u002Fspan><div>\n            <h4>Sub-agents in parallel<\u002Fh4>\n            <p>Each runs in its own context. The main thread stays clean and focused.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n          <li><span class=\"n\">12<\u002Fspan><div>\n            <h4>Custom skills<\u002Fh4>\n            <p>Drop reusable prompts in <code>.claude/skills/<\u002Fcode>. SOPs become one-line commands the whole team can use.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n          <li><span class=\"n\">13<\u002Fspan><div>\n            <h4>Sub-agents on Haiku<\u002Fh4>\n            <p>Cheap research, big context burn — return a tight summary to Opus on the main thread.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n          <li><span class=\"n\">14<\u002Fspan><div>\n            <h4>Refresh AGENTS.md often<\u002Fh4>\n            <p>Log new patterns and gotchas. Read it as a team each sprint; let Claude propose updates.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n          <li><span class=\"n\">15<\u002Fspan><div>\n            <h4>Route AGENTS.md out<\u002Fh4>\n            <p>Keep it under 200 lines. Link to style guides, reference docs, business context — don't inline them.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n          <li><span class=\"n\">16<\u002Fspan><div>\n            <h4>Exit early, re-prompt<\u002Fh4>\n            <p>Hit escape the moment Claude veers off. Don't burn tokens watching it fail.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n          <li><span class=\"n\">17<\u002Fspan><div>\n            <h4>Challenge outputs<\u002Fh4>\n            <p>\"Scrap that. Do a more elegant version.\" Then update the skill so it doesn't happen again.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n          <li><span class=\"n\">18<\u002Fspan><div>\n            <h4><code>/rewind<\u002Fcode> for quick undos<\u002Fh4>\n            <p>Roll back to a previous point instead of starting over from scratch.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n          <li><span class=\"n\">19<\u002Fspan><div>\n            <h4>Hooks for notifications<\u002Fh4>\n            <p><code>/hooks<\u002Fcode> pings on session finish. Run 15 in parallel; only check the loud ones.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n          <li><span class=\"n\">20<\u002Fspan><div>\n            <h4>Use screenshots<\u002Fh4>\n            <p>Claude can see. Feed it errors, inspiration, half-built sites; let it screenshot its own work.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n          <li><span class=\"n\">21<\u002Fspan><div>\n            <h4>Chrome DevTools<\u002Fh4>\n            <p>Claude clicks, fills forms, tests behaviour. Closes the loop on UI work.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n          <li><span class=\"n\">22<\u002Fspan><div>\n            <h4>Clone inspiration sites<\u002Fh4>\n            <p>Screenshot a site you like and say \"make it look like this.\" No more generic AI slop.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n        <\u002Fol>\n      <\u002Fsection>\n\n      <!-- PRO -->\n      <section class=\"col\" data-tier=\"pro\">\n        <header class=\"col-head\">\n          <span class=\"label\">Pro<\u002Fspan>\n          <span class=\"range\">23 — 32<\u002Fspan>\n        <\u002Fheader>\n        <ol class=\"tips\">\n          <li><span class=\"n\">23<\u002Fspan><div>\n            <h4>Parallel sessions, git worktrees<\u002Fh4>\n            <p>Same project, isolated branches. Four or five sessions at once with no overwriting.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n          <li><span class=\"n\">24<\u002Fspan><div>\n            <h4>API endpoints over MCP<\u002Fh4>\n            <p>MCPs load every tool definition into context. If you only need one endpoint, hardcode it.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n          <li><span class=\"n\">25<\u002Fspan><div>\n            <h4><code>/loop<\u002Fcode> for recurring tasks<\u002Fh4>\n            <p>\"Check the deploy every 5 minutes.\" Runs in the same session for up to three days.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n          <li><span class=\"n\">26<\u002Fspan><div>\n            <h4>Host on a VPS<\u002Fh4>\n            <p>SSH in, trigger from Telegram. Laptop closed, Claude still working.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n          <li><span class=\"n\">27<\u002Fspan><div>\n            <h4>Remote control from your phone<\u002Fh4>\n            <p>Start a heavy task at your desk, steer it from a coffee shop.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n          <li><span class=\"n\">28<\u002Fspan><div>\n            <h4>No-SQL data analytics<\u002Fh4>\n            <p>Wire up the BigQuery CLI. Ask in plain English; get the answer back.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n          <li><span class=\"n\">29<\u002Fspan><div>\n            <h4>Edit permissions for safe autonomy<\u002Fh4>\n            <p>Allow what's safe. Deny what's destructive. Same speed as <code>--dangerously-skip-permissions<\u002Fcode>, none of the risk.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n          <li><span class=\"n\">30<\u002Fspan><div>\n            <h4>Agent teams<\u002Fh4>\n            <p>Sub-agents that talk to each other, share a task list, and assign work. More expensive — far more cohesive.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n          <li><span class=\"n\">31<\u002Fspan><div>\n            <h4>Context7 MCP<\u002Fh4>\n            <p>Pulls up-to-date docs from thousands of libraries before Claude writes code. Stops it hallucinating deprecated APIs.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n          <li><span class=\"n\">32<\u002Fspan><div>\n            <h4>The one most people skip<\u002Fh4>\n            <p>Type <code>ultrathink<\u002Fcode> and Claude allocates its maximum reasoning budget (~32K tokens). Use it on architecture, big refactors, and stubborn bugs.<\u002Fp>\n          <\u002Fdiv><\u002Fli>\n        <\u002Fol>\n      <\u002Fsection>\n\n    <\u002Fdiv>\n\n    <!-- Hero: The real unlock -->\n    <div class=\"hero\" style=\"margin-top: 4mm;\">\n      <span class=\"key\">The real unlock<\u002Fspan>\n      <div>\n        <h3>It isn't <em>better prompts<\u002Fem>.<\u002Fh3>\n        <p>It's how you set up the workflow around Claude. Cleaner context. Smaller tasks. Self-checking loops. Cheaper models for grunt work. Permissions tuned right.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Footer -->\n    <div class=\"foot\">\n      <div class=\"left\">\n        <span class=\"mono\">Field guide · 01 / 01<\u002Fspan>\n        <span class=\"sep\"><\u002Fspan>\n        <span class=\"quote\">\"The biggest gains come from how you set up the workflow around Claude.\"<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"monogram\">\n        <span class=\"circle\">M<\u002Fspan>\n        <span class=\"word\">MONTERRO<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
